name: Generar y subir video
on:
  schedule:
    - cron: '17 23 * * *' # 20:17 Argentina; publicación prevista a las 21:00
  workflow_dispatch:
    inputs:
      subir:
        description: Subir y programar en YouTube
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: youtube
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generar una temática nueva
        run: python video.py
      - name: Guardar historial antes de subir
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historial.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar temática utilizada"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Subir video generado
        if: ${{ (github.event_name == 'schedule' || inputs.subir) && hashFiles('salida/tema.json') != '' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python video.py --subir-existente
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: video
          path: salida/video.mp4
          if-no-files-found: ignore
          retention-days: 3
